apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudguard
resources:
  - ../../base
patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: backend
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: cloudguard
images:
  - name: cloudguard-backend
    newName: REPLACE_WITH_ECR_REGISTRY/cloudguard-backend
    newTag: REPLACE_WITH_GIT_SHA
  - name: cloudguard-frontend
    newName: REPLACE_WITH_ECR_REGISTRY/cloudguard-frontend
    newTag: REPLACE_WITH_GIT_SHA
